openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: carecompass
    description: Private, in-memory patient navigation assistance
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /carecompass/navigate:
    post:
      operationId: createCareCompassPlan
      tags: [carecompass]
      summary: Create a non-diagnostic hospital navigation plan
      description: Processes the request and optional document in memory only. No patient data is persisted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CareCompassRequest"
      responses:
        "200":
          description: Navigation plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareCompassPlan"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: Request exceeds the document size limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Document processing error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: The AI response could not be validated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: AI model or service is unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    CareCompassRequest:
      type: object
      properties:
        situation:
          type: string
          minLength: 3
          maxLength: 3000
        documentText:
          type: string
          maxLength: 12000
        fileName:
          type: string
          maxLength: 255
        mediaType:
          type: string
          enum:
            - application/pdf
            - image/jpeg
            - image/png
            - image/gif
            - image/webp
        documentBase64:
          type: string
          maxLength: 9800000
        language:
          type: string
          enum:
            - English
            - Tamil
            - Hindi
      required:
        - situation
    CareCompassDoctor:
      type: object
      properties:
        name:
          type: string
        specialty:
          type: string
        hospital:
          type: string
        city:
          type: string
        qualification:
          type: string
        experience:
          type: string
        languages:
          type: array
          items:
            type: string
        timing:
          type: string
        location:
          type: string
        profileUrl:
          type: ["string", "null"]
      required:
        - name
        - specialty
        - hospital
        - city
        - qualification
        - experience
        - languages
        - timing
        - location
        - profileUrl
    CareCompassRelatedDepartment:
      type: object
      properties:
        name:
          type: string
        doctors:
          type: array
          items:
            $ref: "#/components/schemas/CareCompassDoctor"
      required:
        - name
        - doctors
    CareCompassPlan:
      type: object
      properties:
        department:
          $ref: "#/components/schemas/CareCompassDepartment"
        extractedInformation:
          $ref: "#/components/schemas/CareCompassExtractedInformation"
        visitChecklist:
          type: array
          items:
            $ref: "#/components/schemas/CareCompassChecklistItem"
        documentSummary:
          type: ["string", "null"]
        questionsToAskDoctor:
          type: array
          minItems: 0
          maxItems: 7
          items:
            type: string
        emergency:
          $ref: "#/components/schemas/CareCompassEmergency"
        doctors:
          type: array
          items:
            $ref: "#/components/schemas/CareCompassDoctor"
        relatedDepartments:
          type: array
          items:
            $ref: "#/components/schemas/CareCompassRelatedDepartment"
        matchedDoctor:
          oneOf:
            - $ref: "#/components/schemas/CareCompassDoctor"
            - type: "null"
        dataNote:
          type: string
      required:
        - department
        - extractedInformation
        - visitChecklist
        - documentSummary
        - questionsToAskDoctor
        - emergency
    CareCompassDepartment:
      type: object
      properties:
        name:
          type: string
        reason:
          type: string
        urgency:
          type: string
          enum:
            - routine
            - soon
            - urgent-seek-care-now
      required:
        - name
        - reason
        - urgency
    CareCompassExtractedInformation:
      type: object
      properties:
        medicines:
          type: array
          items:
            $ref: "#/components/schemas/CareCompassMedicine"
        dates:
          type: array
          items:
            type: string
        doctors:
          type: array
          items:
            type: string
        previousConditions:
          type: array
          items:
            type: string
        otherDetails:
          type: array
          items:
            type: string
      required:
        - medicines
        - dates
        - doctors
        - previousConditions
        - otherDetails
    CareCompassMedicine:
      type: object
      properties:
        name:
          type: string
        dosage:
          type: ["string", "null"]
        instructions:
          type: ["string", "null"]
      required:
        - name
        - dosage
        - instructions
    CareCompassChecklistItem:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        checked:
          type: boolean
      required:
        - id
        - label
        - checked
    CareCompassEmergency:
      type: object
      properties:
        detected:
          type: boolean
        message:
          type: ["string", "null"]
      required:
        - detected
        - message
